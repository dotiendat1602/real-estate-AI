dataset: single_turn_goldens_medium_genuinely_hard_100_candidate_v5_rebalanced_v1.json

embedding_models:
  - name: intfloat/multilingual-e5-small
    slug: multilingual_e5_small_ghr1
  - name: intfloat/multilingual-e5-base
    slug: multilingual_e5_base_ghr1
  - name: BAAI/bge-m3
    slug: bge_m3_ghr1

top_k: [8, 16, 24]

planning_chunking_modes:
  - planning_baseline_fixed
  - planning_hierarchical_parent_context
  - planning_hierarchical_parent_child

smoke:
  max_cases: 20

full:
  top_n: 4
  smoke_summary: experiments/genuinely_hard_rebalanced_v1_smoke_matrix_20260425/summary.csv

runner:
  trace_max_concurrent: 1
  judge_max_concurrent: 2
  throttle_seconds: 0.2
  eval_batch_size: 0
  sync: false
  manual_metric_loop: true

corpus:
  posts_manifest: evaluation/corpus/posts.full.jsonl
  planning_manifest: evaluation/corpus/planning_documents.full.jsonl
