[project]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "asyncpg>=0.29",
  "pgvector>=0.2.5",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "sentence-transformers>=2.6",
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "langchain-core>=0.2.0",
  "langchain-text-splitters>=0.2.0",
  "langchain-postgres>=0.0.9",
  "langchain-openai>=0.2.0",
  "openai>=1.0.0",
  "deepeval>=2.0.0",
  "pyyaml>=6.0.1",
  "langid>=1.1.6",
  "alembic>=1.7",
  "pypdf>=5.4.0",
]
description = "RAG AI service for Estatein using FastAPI + pgvector"
name = "estatein-ai-service"
requires-python = ">=3.10"
version = "0.1.0"

[tool.uvicorn]
factory = false
