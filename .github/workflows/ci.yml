name: AI Service CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install rapidocr pypdfium2

      - name: Import application
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          PGVECTOR_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          OPENAI_API_KEY: test
        run: python -c "from app.main import app; print(app.title)"

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "AI_SERVICE_IMAGE=${REGISTRY}/${repo}/ai-service" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
          tags: |
            ${{ env.AI_SERVICE_IMAGE }}:${{ github.sha }}
            ${{ env.AI_SERVICE_IMAGE }}:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  deploy:
    name: Deploy AI service
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.AI_DEPLOY_PATH || '/opt/real-estate/ai-service' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.venv/' \
            --include='.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.deepeval/' \
            --exclude='evaluation/reports/' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.AI_DEPLOY_PATH || '/opt/real-estate/ai-service' }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          ai_service_image="${REGISTRY}/${repo}/ai-service:latest"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            touch .env
            if grep -q '^AI_SERVICE_IMAGE=' .env; then
              sed -i 's|^AI_SERVICE_IMAGE=.*|AI_SERVICE_IMAGE=$ai_service_image|' .env
            else
              printf '\nAI_SERVICE_IMAGE=$ai_service_image\n' >> .env
            fi
            if [ -n '$GHCR_PAT' ]; then
              echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "
